<section class="lg:border border-gray-200 lg:rounded-xl lg:p-5 flex flex-col gap-10">

  <div class="flex flex-col md:flex-row items-stretch md:items-center justify-between gap-4">
    <!-- Search Box -->
    <component-shared-search-box class="w-full md:max-w-md"
      placeholder="Buscar pago por Recibo, Factura, Suministro o Cliente..." [searchQuery]="searchQuery"
      (searchQueryChange)="onSearchQuery($event)" />

    <!-- Export & Filters -->
    <div class="flex items-center gap-x-1">
      <component-shared-export (onExport)="handleExport($event)" />
      <component-shared-filters [activeFiltersCount]="activeFiltersCount" offcanvasId="payments-filter-offcanvas">

        <form [formGroup]="filterForm" (ngSubmit)="applyFilters()" class="flex flex-col gap-y-5">

          <!-- Método de Pago -->
          <div class="space-y-2">
            <label class="text-sm font-medium text-gray-800">Método de Pago</label>
            <select formControlName="method"
              class="w-full border border-gray-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white text-gray-700">
              <option value="">Todos los métodos</option>
              <option value="CASH">Efectivo</option>
              <option value="CARD">Tarjeta</option>
              <option value="YAPE">Yape</option>
              <option value="PLIN">Plin</option>
              <option value="BANK_TRANSFER">Transferencia</option>
            </select>
          </div>

          <!-- Estado -->
          <div class="space-y-2">
            <label class="text-sm font-medium text-gray-800">Estado</label>
            <select formControlName="status"
              class="w-full border border-gray-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white text-gray-700">
              <option value="">Todos los estados</option>
              <option value="COMPLETED">Completados</option>
              <option value="PENDING">Pendientes</option>
              <option value="FAILED">Fallidos</option>
              <option value="CANCELLED">Cancelados</option>
            </select>
          </div>

          <!-- Fechas -->
          <div class="space-y-2">
            <label class="text-sm font-medium text-gray-800">Fecha Pago Desde</label>
            <input type="datetime-local" formControlName="startDate"
              class="w-full border border-gray-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white text-gray-700" />
          </div>
          <div class="space-y-2">
            <label class="text-sm font-medium text-gray-800">Fecha Pago Hasta</label>
            <input type="datetime-local" formControlName="endDate"
              class="w-full border border-gray-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white text-gray-700" />
          </div>

          <!-- Botones de Acción -->
          <div class="flex items-center gap-x-2 pt-4 border-t border-gray-100 mt-2">
            <button type="button" (click)="clearFilters()" data-hs-overlay="#payments-filter-offcanvas"
              class="w-full py-2 px-3 inline-flex justify-center items-center gap-x-2 text-sm font-medium rounded-lg border border-gray-200 bg-white text-gray-800 shadow-sm hover:bg-gray-50 disabled:opacity-50 disabled:pointer-events-none">
              Limpiar
            </button>
            <button type="submit" data-hs-overlay="#payments-filter-offcanvas"
              class="w-full py-2 px-3 inline-flex justify-center items-center gap-x-2 text-sm font-semibold rounded-lg border border-transparent bg-blue-600 text-white hover:bg-blue-700 disabled:opacity-50 disabled:pointer-events-none">
              Aplicar
            </button>
          </div>

        </form>

      </component-shared-filters>
    </div>
  </div>

  <!-- Loading State -->
  <div *ngIf="isLoading" class="flex justify-center py-10">
    <div
      class="animate-spin inline-block size-6 border-2 border-current border-t-transparent text-blue-600 rounded-full"
      role="status" aria-label="loading"></div>
  </div>

  <!-- Table Component -->
  <component-dashboard-payments-table *ngIf="!isLoading && payments.length > 0" [payments]="payments"
    [isLoading]="isLoading" (print)="printReceipt($event)" (cancel)="cancelPayment($event)" />

  <!-- Empty State Component -->
  <component-dashboard-payments-empty *ngIf="!isLoading && payments.length === 0" />

  <!-- Paginator Component -->
  <component-shared-paginator *ngIf="!isLoading && totalPages > 1" [page]="currentPage" [totalPages]="totalPages"
    [totalElements]="totalElements" (pageChange)="onPageChange($event)" />

</section>
