<section class="lg:border border-gray-200 lg:rounded-xl lg:p-5 flex flex-col gap-10 bg-white">

  <div class="flex items-center justify-between gap-2 flex-wrap">
    <component-shared-search-box class="w-full md:max-w-md"
      placeholder="Buscar por factura, suministro o cliente..." [searchQuery]="searchQuery"
      (searchQueryChange)="onSearchQuery($event)" />

    <div class="flex items-center gap-x-2.5">
      <component-shared-filters [activeFiltersCount]="activeFiltersCount" offcanvasId="cobranza-filter-offcanvas">
        <form [formGroup]="filterForm" (ngSubmit)="applyFilters()" class="flex flex-col gap-y-5">
          <!-- Tipo / Estado -->
          <div class="space-y-2">
            <label class="text-sm font-medium text-gray-800">Tipo / Estado</label>
            <select formControlName="status" class="w-full border border-gray-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white text-gray-700 cursor-pointer">
              <option value="ALL_PENDING">Todos los pendientes de cobro</option>
              <option value="PENDING">Facturas Pendientes</option>
              <option value="OVERDUE">Facturas Vencidas</option>
              <option value="PARTIALLY_PAID">Pagos Parciales</option>
            </select>
          </div>

          <!-- Rango de Fechas -->
          <div class="space-y-2">
            <label class="text-sm font-medium text-gray-800 block">Rango de Fechas</label>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="text-xs text-gray-500 mb-1 block">Desde</label>
                <input type="datetime-local" formControlName="startDate" class="w-full border border-gray-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white text-gray-700" />
              </div>
              <div>
                <label class="text-xs text-gray-500 mb-1 block">Hasta</label>
                <input type="datetime-local" formControlName="endDate" class="w-full border border-gray-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white text-gray-700" />
              </div>
            </div>
          </div>

          <div class="pt-4 border-t border-gray-200 flex justify-end">
            <button type="button" (click)="filterForm.reset({ status: 'ALL_PENDING' }); applyFilters()" class="py-2 px-3 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg border border-gray-200 bg-white text-gray-800 shadow-sm hover:bg-gray-50 focus:outline-none focus:bg-gray-50 mr-2 cursor-pointer">
              Limpiar
            </button>
            <button type="submit" class="py-2 px-3 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg border border-transparent bg-blue-600 text-white hover:bg-blue-700 focus:outline-none focus:bg-blue-700 cursor-pointer" [attr.data-hs-overlay]="'#cobranza-filter-offcanvas'">
              Aplicar filtros
            </button>
          </div>
        </form>
      </component-shared-filters>
    </div>
  </div>

  <div *ngIf="isLoading" class="flex justify-center py-10">
    <div
      class="animate-spin inline-block size-6 border-2 border-current border-t-transparent text-blue-600 rounded-full"
      role="status" aria-label="loading"></div>
  </div>

  <component-dashboard-cobranza-table *ngIf="!isLoading && billings.length > 0" [billings]="billings"
    [isLoading]="isLoading" (pay)="registerPayment($event)" (generateAviso)="generateAviso($event)" (suspendSupply)="suspendSupply($event)" />

  <component-dashboard-cobranza-empty *ngIf="!isLoading && billings.length === 0" />

  <component-shared-paginator *ngIf="!isLoading && totalPages > 1" [page]="currentPage" [totalPages]="totalPages"
    [totalElements]="totalElements" (pageChange)="onPageChange($event)" />

</section>
