<section class="overflow-x-hidden hover:overflow-x-auto">
  <div class="min-w-full inline-block align-middle">
    <div class="overflow-hidden">
      <table class="min-w-full">
        <thead>
          <tr class="bg-gray-100 text-sm">
            <th scope="col" class="px-6 py-3 text-nowrap font-semibold text-xs uppercase text-start">Código</th>
            <th scope="col" class="px-6 py-3 text-nowrap font-semibold text-xs uppercase text-start">Tipo</th>
            <th scope="col" class="px-6 py-3 text-nowrap font-semibold text-xs uppercase text-start">Cliente</th>
            <th scope="col" class="px-6 py-3 text-nowrap font-semibold text-xs uppercase text-start">Prioridad</th>
            <th scope="col" class="px-6 py-3 text-nowrap font-semibold text-xs uppercase text-start">Estado</th>
            <th scope="col" class="px-6 py-3 text-nowrap font-semibold text-xs uppercase text-start">Fecha</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-200">
          <tr *ngFor="let item of items" [routerLink]="['/dashboard/incidencias', item.id]" class="group hover:bg-gray-50 hover:cursor-pointer max-xl:w-full">
            <td class="px-6 py-2.5 text-sm font-medium text-blue-600 group-hover:underline text-nowrap">
              {{ item.incidentNumber }}
            </td>
            <td class="px-6 py-2.5 text-sm font-medium text-gray-800 text-nowrap">
              {{ getTypeLabel(item.type) }}
            </td>
            <td class="px-6 py-2.5 text-sm max-w-48 truncate">
              <span class="font-medium truncate">{{ item.customerName ?? 'Sistema (Automático)' }}</span>
            </td>
            <td class="px-6 py-2.5 text-sm text-nowrap">
              <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold" [ngClass]="getPriorityClass(item.priority)">
                {{ getPriorityLabel(item.priority) }}
              </span>
            </td>
            <td class="px-6 py-2.5 text-sm text-nowrap">
              <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold border" [ngClass]="getStatusClass(item.status)">
                {{ getStatusLabel(item.status) }}
              </span>
            </td>
            <td class="px-6 py-2.5 text-sm text-nowrap text-gray-600">
              {{ formatDate(item.reportedDate) }}
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
