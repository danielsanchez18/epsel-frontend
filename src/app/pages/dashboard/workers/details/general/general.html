<main class="w-full px-4 md:px-7 xl:px-10 flex flex-col gap-2">

  <div class="mb-3">
    <a routerLink=".." class="text-sm text-blue-600 font-semibold hover:underline hover:text-blue-600-dark">Regresar</a>
    <h1 class="text-lg font-medium">Detalles del Usuario</h1>
  </div>

  <article class="p-4 md:p-5 rounded-2xl space-y-2 border border-gray-200 bg-white">
    <div class="relative h-50">
      <div class="absolute inset-0 w-full rounded-xl h-40 bg-black/10 overflow-hidden">
        <img src="/svg/Background.svg" alt="background" class="w-full h-full object-cover">
      </div>
      <div class="absolute top-15 w-full">

        @if (user?.photoUrl) {
          <img src="{{ user?.photoUrl | publicUrl }}" class="min-w-35 max-w-35 h-35 border-4 mx-auto border-white bg-gray-200 rounded-full object-cover" alt="Foto de {{ user?.names }}" />
        } @else {
          <div class="min-w-35 max-w-35 h-35 text-6xl border-4 border-white mx-auto text-white bg-blue-600 font-semibold rounded-full object-cover flex items-center justify-center">
            {{ user?.names?.charAt(0) }}{{ user?.lastNames?.charAt(0) }}
          </div>
        }

      </div>
    </div>

    <div class="text-center mt-3 mb-7">
      <h2 class="text-lg font-medium">{{ user?.names }} {{ user?.lastNames }}</h2>
      <p class="text-sm text-gray-700">{{ user?.email }}</p>
    </div>

    <div class="flex items-center gap-x-1">
      <a routerLink="/dashboard/personal/{{ user?.id }}"
        routerLinkActive="bg-gray-100 text-black! font-medium"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex items-center gap-x-1.5 text-sm px-2.5 py-2 rounded-lg bg-gray-100">
        <svg lucideUser class="size-3.5" />
        Información General
      </a>
      <a routerLink="seguridad"
        routerLinkActive="bg-gray-100 text-black! font-medium"
        class="flex items-center gap-x-1.5 text-sm px-2.5 py-2 text-gray-800 hover:text-black rounded-lg hover:bg-gray-100">
        <svg lucideLock class="size-3.5" />
        Seguridad
      </a>
      <a routerLink="historial-operativo"
        routerLinkActive="bg-gray-100 text-black! font-medium"
        class="flex items-center gap-x-1.5 text-sm px-2.5 py-2 text-gray-800 hover:text-black rounded-lg hover:bg-gray-100">
        <svg lucideActivity class="size-3.5" />
        Historial Operativo
      </a>
      <a href="mailto:{{ user?.email }}"
        class="ml-auto flex items-center gap-x-1.5 text-sm px-2.5 py-2 font-medium text-white bg-blue-600 hover:bg-blue-600-dark rounded-lg">
        <svg lucideMail class="size-4" />
        Enviar correo
      </a>
    </div>
  </article>

  <router-outlet />

</main>
