<div class="bg-white rounded-2xl border border-gray-200 p-2 flex flex-col h-[400px]">
    <!-- Header -->
    <div class="flex gap-x-3 p-3">
        <svg lucideHistory class="size-6 text-gray-500 mt-0.5" />
        <div>
            <h2 class="text-sm font-medium">Actividad Reciente</h2>
            <p class="text-xs text-gray-500">Últimos eventos registrados en la plataforma</p>
        </div>
    </div>

    <!-- Content / Timeline -->
    <div class="flex-1 overflow-y-auto pr-1 relative custom-scrollbar p-1">
        <ng-container *ngIf="isLoading; else activityTemplate">
            <!-- Loading Skeleton -->
            <div class="space-y-6 pl-4 border-l border-gray-100">
                <div *ngFor="let item of [1, 2, 3]" class="relative space-y-2 animate-pulse pl-5">
                    <div class="absolute left-[-28px] top-0 size-6 bg-gray-100 rounded-full border-2 border-white">
                    </div>
                    <div class="h-3 bg-gray-100 rounded w-1/4"></div>
                    <div class="h-4 bg-gray-100 rounded w-3/4"></div>
                    <div class="h-3 bg-gray-100 rounded w-1/3"></div>
                </div>
            </div>
        </ng-container>

        <ng-template #activityTemplate>
            <ng-container *ngIf="activities.length > 0; else emptyState">
                <!-- Timeline Container with line -->
                <div class="relative space-y-1">
                    <div *ngFor="let act of activities; let last = last"
                        class="relative group flex gap-x-3 rounded-md bg-gray-100 px-4 py-2">

                        <!-- Timeline Badge/Dot -->
                        <span class="mt-0.5 text-gray-500">
                            <svg *ngIf="act.action === 'Pago'" lucideCreditCard class="size-4.5" />
                            <svg *ngIf="act.action === 'Factura'" lucideFileText class="size-4.5" />
                            <svg *ngIf="act.action === 'Lectura'" lucideDroplets class="size-4.5" />
                            <svg *ngIf="act.action === 'Orden'" lucideWrench class="size-4.5" />
                            <svg *ngIf="act.action !== 'Pago' && act.action !== 'Factura' && act.action !== 'Lectura' && act.action !== 'Orden'"
                                lucideHelpCircle class="size-4.5" />
                        </span>

                        <!-- Activity Text -->
                        <div class="">
                            <div class="flex items-center gap-x-3">
                                <span class="text-sm font-medium">
                                    {{ act.action }}
                                </span>

                                <!-- Date/Time Relative -->
                                <span class="text-xs text-gray-700 flex items-center gap-x-1">
                                    <!-- <svg lucideClock class="size-3" /> -->
                                    <div class="bg-blue-600 min-w-1 size-1 rounded-full"></div>
                                    {{ getRelativeTime(act.date) }}
                                </span>
                            </div>
                            <p class="text-xs text-gray-700 leading-relaxed">{{ act.description }}</p>
                        </div>

                    </div>
                </div>
            </ng-container>

            <ng-template #emptyState>
                <div class="flex flex-col items-center justify-center h-full text-center space-y-3 py-6">
                    <div class="p-4 bg-gray-50 text-gray-400 rounded-full">
                        <svg lucideHistory class="size-10 stroke-[1.5]" />
                    </div>
                    <div class="space-y-1 max-w-sm">
                        <h3 class="text-sm font-semibold text-gray-800">Sin actividad reciente</h3>
                        <p class="text-xs text-gray-500 leading-relaxed">No se han registrado operaciones o cambios de
                            estado en las últimas horas.</p>
                    </div>
                </div>
            </ng-template>
        </ng-template>
    </div>
</div>
