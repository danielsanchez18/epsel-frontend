<div class="bg-white rounded-2xl border border-gray-200 p-5 space-y-7 flex flex-col h-[400px]">
    <!-- Header -->
    <div class="flex gap-x-3">
        <svg lucideHistory class="size-6 text-gray-500 mt-0.5" />
        <div>
            <h2 class="text-sm font-medium">Actividad Reciente</h2>
            <p class="text-xs text-gray-500">Últimos eventos registrados en la plataforma</p>
        </div>
    </div>

    <!-- Content / Timeline -->
    <div class="flex-1 overflow-y-auto pr-1 relative custom-scrollbar">
        <ng-container *ngIf="isLoading; else activityTemplate">
            <!-- Loading Skeleton -->
            <div class="space-y-6 pl-4 border-l border-gray-100">
                <div *ngFor="let item of [1, 2, 3]" class="relative space-y-2 animate-pulse pl-5">
                    <div class="absolute left-[-28px] top-0 size-6 bg-gray-100 rounded-full border-2 border-white">
                    </div>
                    <div class="h-3 bg-gray-100 rounded w-1/4"></div>
                    <div class="h-4 bg-gray-100 rounded w-3/4"></div>
                    <div class="h-3 bg-gray-100 rounded w-1/3"></div>
                </div>
            </div>
        </ng-container>

        <ng-template #activityTemplate>
            <ng-container *ngIf="activities.length > 0; else emptyState">
                <!-- Timeline Container with line -->
                <div class="relative space-y-5">
                    <div *ngFor="let act of activities; let last = last" class="relative group">

                        <!-- Timeline Badge/Dot -->
                        <span
                            class="flex items-center justify-center size-7 rounded-full border-2 border-white shadow-sm transition-transform duration-200 group-hover:scale-110"
                            [ngClass]="{
                    'bg-blue-50 text-blue-600 border-blue-200': act.action === 'Pago',
                    'bg-purple-50 text-purple-600 border-purple-200': act.action === 'Factura',
                    'bg-emerald-50 text-emerald-600 border-emerald-200': act.action === 'Lectura',
                    'bg-orange-50 text-orange-600 border-orange-200': act.action === 'Orden',
                    'bg-gray-50 text-gray-600 border-gray-200': act.action !== 'Pago' && act.action !== 'Factura' && act.action !== 'Lectura' && act.action !== 'Orden'
                  }">
                            <svg *ngIf="act.action === 'Pago'" lucideCreditCard class="size-3.5 stroke-[2.5]" />
                            <svg *ngIf="act.action === 'Factura'" lucideFileText class="size-3.5 stroke-[2.5]" />
                            <svg *ngIf="act.action === 'Lectura'" lucideDroplets class="size-3.5 stroke-[2.5]" />
                            <svg *ngIf="act.action === 'Orden'" lucideWrench class="size-3.5 stroke-[2.5]" />
                            <svg *ngIf="act.action !== 'Pago' && act.action !== 'Factura' && act.action !== 'Lectura' && act.action !== 'Orden'"
                                lucideHelpCircle class="size-3.5 stroke-[2.5]" />
                        </span>

                        <!-- Activity Text -->
                        <div class="space-y-1">
                            <div class="flex items-center gap-x-2">
                                <span class="text-xs font-semibold px-2 py-0.5 rounded-full" [ngClass]="{
                        'bg-blue-100/70 text-blue-700': act.action === 'Pago',
                        'bg-purple-100/70 text-purple-700': act.action === 'Factura',
                        'bg-emerald-100/70 text-emerald-700': act.action === 'Lectura',
                        'bg-orange-100/70 text-orange-700': act.action === 'Orden',
                        'bg-gray-100 text-gray-700': act.action !== 'Pago' && act.action !== 'Factura' && act.action !== 'Lectura' && act.action !== 'Orden'
                      }">
                                    {{ act.action }}
                                </span>

                                <!-- Date/Time Relative -->
                                <span class="text-[11px] text-gray-400 flex items-center gap-x-1">
                                    <svg lucideClock class="size-3" />
                                    {{ getRelativeTime(act.date) }}
                                </span>
                            </div>
                            <p class="text-xs text-gray-700 font-medium mt-1 leading-relaxed">{{ act.description }}</p>
                        </div>

                    </div>
                </div>
            </ng-container>

            <ng-template #emptyState>
                <div class="flex flex-col items-center justify-center h-full text-center space-y-3 py-6">
                    <div class="p-4 bg-gray-50 text-gray-400 rounded-full">
                        <svg lucideHistory class="size-10 stroke-[1.5]" />
                    </div>
                    <div class="space-y-1 max-w-sm">
                        <h3 class="text-sm font-semibold text-gray-800">Sin actividad reciente</h3>
                        <p class="text-xs text-gray-500 leading-relaxed">No se han registrado operaciones o cambios de
                            estado en las últimas horas.</p>
                    </div>
                </div>
            </ng-template>
        </ng-template>
    </div>
</div>
