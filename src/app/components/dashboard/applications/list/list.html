<section class="lg:border border-gray-200 lg:rounded-xl lg:p-5 flex flex-col gap-10">

  <div class="flex items-center justify-between gap-2">

    <component-shared-search-box
      class="w-full md:max-w-md"
      placeholder="Buscar solicitudes por zona o cliente"
      [searchQuery]="searchQuery"
      (searchQueryChange)="onSearchQuery($event)"
    />

    <div class="flex items-center gap-x-1">
      <component-shared-import 
        #importComponent
        [isLoading]="isImportLoading"
        [previewData]="importPreviewData"
        (onFileSelect)="handleFileSelect($event)"
        (onConfirm)="handleImportConfirm($event)"
        (onDownloadTemplate)="handleDownloadTemplate()"
      />
      <component-shared-export (onExport)="handleExport($event)" />
      <component-shared-filters [activeFiltersCount]="activeFiltersCount" offcanvasId="applications-filter-offcanvas">
        
        <form [formGroup]="filterForm" (ngSubmit)="applyFilters()" class="flex flex-col gap-y-5">
          
          <!-- Estado de Solicitud -->
          <div class="space-y-2">
            <label class="text-sm font-medium text-gray-800">Estado</label>
            <select formControlName="status" class="w-full border border-gray-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white text-gray-700">
              <option value="">Todos los estados</option>
              <option value="PENDING">Pendiente</option>
              <option value="APPROVED">Aprobada</option>
              <option value="REJECTED">Rechazada</option>
              <option value="CANCELLED">Cancelada</option>
            </select>
          </div>

          <!-- Nombre de Zona -->
          <div class="space-y-2">
            <label class="text-sm font-medium text-gray-800">Zona</label>
            <input type="text" formControlName="zoneName" placeholder="Ej. Zona Norte" class="w-full border border-gray-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white text-gray-700" />
          </div>

          <!-- Rango de Fechas -->
          <div class="space-y-2">
            <label class="text-sm font-medium text-gray-800">Fecha de Solicitud (Desde)</label>
            <input type="datetime-local" formControlName="startDate" class="w-full border border-gray-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white text-gray-700" />
          </div>

          <div class="space-y-2">
            <label class="text-sm font-medium text-gray-800">Fecha de Solicitud (Hasta)</label>
            <input type="datetime-local" formControlName="endDate" class="w-full border border-gray-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white text-gray-700" />
          </div>

          <!-- Botones de Acción -->
          <div class="flex items-center gap-x-2 pt-4 border-t border-gray-100 mt-2">
            <button type="button" (click)="clearFilters()" data-hs-overlay="#applications-filter-offcanvas"
              class="w-full py-2 px-3 inline-flex justify-center items-center gap-x-2 text-sm font-medium rounded-lg border border-gray-200 bg-white text-gray-800 shadow-sm hover:bg-gray-50 disabled:opacity-50 disabled:pointer-events-none">
              Limpiar
            </button>
            <button type="submit" data-hs-overlay="#applications-filter-offcanvas"
              class="w-full py-2 px-3 inline-flex justify-center items-center gap-x-2 text-sm font-semibold rounded-lg border border-transparent bg-blue-600 text-white hover:bg-blue-700 disabled:opacity-50 disabled:pointer-events-none">
              Aplicar
            </button>
          </div>

        </form>

      </component-shared-filters>
    </div>

  </div>

  <component-dashboard-applications-table
    [items]="requests"
    *ngIf="requests.length > 0"
  />

  <component-dashboard-applications-empty
    *ngIf="requests.length === 0 && !isLoading"
    [title]="searchQuery || activeFiltersCount > 0 ? 'No se encontraron resultados' : 'No tienes solicitudes registradas'"
    [message]="searchQuery || activeFiltersCount > 0 ? 'Intenta ajustando los términos de búsqueda o los filtros aplicados' : 'Registra una nueva solicitud de instalación para empezar a gestionar tu sistema'"
  />

  <component-shared-paginator
    [page]="currentPage"
    [totalPages]="totalPages"
    [totalElements]="totalElements"
    (pageChange)="onPageChange($event)"
  />

</section>
