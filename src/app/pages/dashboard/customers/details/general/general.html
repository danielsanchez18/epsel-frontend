<main class="w-full px-4 md:px-7 xl:px-10 flex flex-col gap-2">

  <div class="mb-3">
    <a routerLink=".." class="text-sm text-blue-600 font-semibold hover:underline hover:text-blue-600-dark">Regresar</a>
    <h1 class="text-lg font-medium">Detalles del Cliente</h1>
  </div>

  <article *ngIf="customer$ | async as customer; else loadingTpl" class="p-4 md:p-5 rounded-2xl space-y-2 border border-gray-200 bg-white">
    <div class="relative h-50">
      <div class="absolute inset-0 w-full rounded-xl h-40 bg-black/10 overflow-hidden">
        <img src="/svg/Background.svg" alt="background" class="w-full h-full object-cover">
      </div>
      <div class="absolute top-15 w-full">
        <div class="min-w-35 max-w-35 h-35 text-6xl border-4 border-white mx-auto text-white bg-blue-600 font-semibold rounded-full object-cover flex items-center justify-center">
          {{ customer.fullName.charAt(0) | uppercase }}
        </div>
      </div>
    </div>

    <div class="text-center mt-3 mb-7">
      <h2 class="text-lg font-medium">{{ customer.fullName }}</h2>
      <p class="text-sm text-gray-700">{{ customer.email || 'Sin correo registrado' }}</p>
    </div>

    <div class="flex items-center gap-x-1 overflow-x-auto pb-2">
      <a [routerLink]="['/dashboard/clientes', customerId]"
        routerLinkActive="bg-gray-100 text-black! font-medium"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex items-center gap-x-1.5 text-sm px-2.5 py-2 rounded-lg bg-gray-100 whitespace-nowrap">
        <svg lucideUser class="size-3.5" />
        Información General
      </a>
      <a routerLink="facturacion"
        routerLinkActive="bg-gray-100 text-black! font-medium"
        class="flex items-center gap-x-1.5 text-sm px-2.5 py-2 text-gray-800 hover:text-black rounded-lg hover:bg-gray-100 whitespace-nowrap">
        <svg lucideFileText class="size-3.5" />
        Facturación
      </a>
      <a routerLink="pagos"
        routerLinkActive="bg-gray-100 text-black! font-medium"
        class="flex items-center gap-x-1.5 text-sm px-2.5 py-2 text-gray-800 hover:text-black rounded-lg hover:bg-gray-100 whitespace-nowrap">
        <svg lucideCreditCard class="size-3.5" />
        Pagos
      </a>
      <a routerLink="suministros"
        routerLinkActive="bg-gray-100 text-black! font-medium"
        class="flex items-center gap-x-1.5 text-sm px-2.5 py-2 text-gray-800 hover:text-black rounded-lg hover:bg-gray-100 whitespace-nowrap">
        <svg lucideDroplets class="size-3.5" />
        Suministros
      </a>
      <a routerLink="reclamos"
        routerLinkActive="bg-gray-100 text-black! font-medium"
        class="flex items-center gap-x-1.5 text-sm px-2.5 py-2 text-gray-800 hover:text-black rounded-lg hover:bg-gray-100 whitespace-nowrap">
        <svg lucideBadgeAlert class="size-3.5" />
        Reclamos
      </a>
      <a *ngIf="customer.email" [href]="'mailto:' + customer.email"
        class="ml-auto flex items-center gap-x-1.5 text-sm px-2.5 py-2 font-medium text-white bg-blue-600 hover:bg-blue-600-dark rounded-lg whitespace-nowrap">
        <svg lucideMail class="size-4" />
        Enviar correo
      </a>
    </div>
  </article>

  <ng-template #loadingTpl>
    <article class="p-4 md:p-5 rounded-2xl flex items-center justify-center border border-gray-200 bg-white h-80">
      <div class="animate-spin inline-block size-8 border-[3px] border-current border-t-transparent text-blue-600 rounded-full" role="status" aria-label="loading"></div>
    </article>
  </ng-template>

  <router-outlet />

</main>
