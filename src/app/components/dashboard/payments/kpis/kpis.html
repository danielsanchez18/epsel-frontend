<section class="grid sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-5 gap-4">

  <!-- Total Hoy -->
  <article class="w-full bg-white py-5 space-y-2 px-5 rounded-xl border border-gray-200 shadow-xs">
    <div class="flex text-sm text-gray-600 items-center justify-between">
      <h3 class="font-medium">Total Hoy</h3>
      <svg lucideCalendar class="size-5 text-blue-600 stroke-[1.5]" />
    </div>
    <div class="space-y-1">
      <p class="font-bold text-xl text-gray-900">S/. {{ totalToday.toFixed(2) }}</p>
    </div>
  </article>

  <!-- Total Mes -->
  <article class="w-full bg-white py-5 space-y-2 px-5 rounded-xl border border-gray-200 shadow-xs">
    <div class="flex text-sm text-gray-600 items-center justify-between">
      <h3 class="font-medium">Total Mes</h3>
      <svg lucideDollarSign class="size-5 text-green-600 stroke-[1.5]" />
    </div>
    <div class="space-y-1">
      <p class="font-bold text-xl text-gray-900">S/. {{ totalMonth.toFixed(2) }}</p>
    </div>
  </article>

  <!-- Efectivo -->
  <article class="w-full bg-white py-5 space-y-2 px-5 rounded-xl border border-gray-200 shadow-xs">
    <div class="flex text-sm text-gray-600 items-center justify-between">
      <h3 class="font-medium">Efectivo</h3>
      <svg lucideCoins class="size-5 text-amber-600 stroke-[1.5]" />
    </div>
    <div class="space-y-1">
      <p class="font-bold text-xl text-gray-900">S/. {{ totalCash.toFixed(2) }}</p>
    </div>
  </article>

  <!-- Yape -->
  <article class="w-full bg-white py-5 space-y-2 px-5 rounded-xl border border-gray-200 shadow-xs">
    <div class="flex text-sm text-gray-600 items-center justify-between">
      <h3 class="font-medium">Yape</h3>
      <svg lucideSmartphone class="size-5 text-purple-600 stroke-[1.5]" />
    </div>
    <div class="space-y-1">
      <p class="font-bold text-xl text-gray-900">S/. {{ totalYape.toFixed(2) }}</p>
    </div>
  </article>

  <!-- Transferencias -->
  <article class="w-full bg-white py-5 space-y-2 px-5 rounded-xl border border-gray-200 shadow-xs">
    <div class="flex text-sm text-gray-600 items-center justify-between">
      <h3 class="font-medium">Transferencias / Tarjetas</h3>
      <svg lucideCreditCard class="size-5 text-indigo-600 stroke-[1.5]" />
    </div>
    <div class="space-y-1">
      <p class="font-bold text-xl text-gray-900">S/. {{ totalTransfer.toFixed(2) }}</p>
    </div>
  </article>

</section>
