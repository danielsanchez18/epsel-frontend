<div class="hs-overlay-animation-target hs-overlay-open:scale-100 hs-overlay-open:opacity-100 scale-95 opacity-0 ease-in-out transition-all duration-200 sm:max-w-xl sm:w-full m-3 sm:mx-auto min-h-[calc(100%-56px)] flex items-center">
  <form [formGroup]="addForm" (ngSubmit)="onSubmit()" class="w-full flex flex-col bg-white border border-gray-300 shadow-2xs rounded-xl pointer-events-auto">

    <!-- Header del modal -->
    <div class="flex justify-between items-center py-3 px-4 border-b border-gray-200">
      <h3 id="hs-scale-animation-modal-label" class="font-medium text-gray-800">Registrar Tarifa de Agua</h3>
      <button type="button" #closeButton
        class="size-8 inline-flex justify-center items-center gap-x-2 rounded-full bg-gray-100 text-gray-800 hover:bg-gray-200 focus:outline-hidden focus:bg-gray-300 disabled:opacity-50 disabled:pointer-events-none"
        aria-label="Close" data-hs-overlay="#hs-scale-animation-modal">
        <span class="sr-only">Close</span>
        <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18"></path>
          <path d="m6 6 12 12"></path>
        </svg>
      </button>
    </div>

    <!-- Contenido del modal -->
    <div class="px-4 py-4 overflow-y-auto grid sm:grid-cols-2 gap-5">

      <div class="flex flex-col gap-y-2 sm:col-span-2">
        <label class="text-sm font-medium">
          Zona Operativa
          <span class="text-red-500 ml-0.5">*</span>
        </label>
        <select
          formControlName="zoneId"
          class="border border-gray-200 rounded-md px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" required>
          <option value="" disabled selected>Seleccione una zona</option>
          <option *ngFor="let zone of zones" [value]="zone.id">{{ zone.name }}</option>
        </select>
        <span *ngIf="addForm.get('zoneId')?.invalid && addForm.get('zoneId')?.touched" class="text-xs text-red-500">
          * La zona es obligatoria.
        </span>
      </div>

      <div class="flex flex-col gap-y-2 sm:col-span-1">
        <label class="text-sm font-medium">
          Precio por m³ (S/)
          <span class="text-red-500 ml-0.5">*</span>
        </label>
        <input type="number" step="0.01" min="0" formControlName="pricePerM3"
          class="border border-gray-200 rounded-md px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="Ej: 2.50" required />
        <span *ngIf="addForm.get('pricePerM3')?.invalid && addForm.get('pricePerM3')?.touched" class="text-xs text-red-500">
          * Obligatorio y mayor a 0.
        </span>
      </div>

      <div class="flex flex-col gap-y-2 sm:col-span-1">
        <label class="text-sm font-medium">
          Cargo Fijo (S/)
          <span class="text-red-500 ml-0.5">*</span>
        </label>
        <input type="number" step="0.01" min="0" formControlName="fixedCharge"
          class="border border-gray-200 rounded-md px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="Ej: 10.00" required />
        <span *ngIf="addForm.get('fixedCharge')?.invalid && addForm.get('fixedCharge')?.touched" class="text-xs text-red-500">
          * Obligatorio y mayor a 0.
        </span>
      </div>

      <div class="flex flex-col gap-y-2 sm:col-span-1">
        <label class="text-sm font-medium">
          Porcentaje de Impuesto (%)
          <span class="text-red-500 ml-0.5">*</span>
        </label>
        <input type="number" step="1" min="0" max="100" formControlName="taxPercentage"
          class="border border-gray-200 rounded-md px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="Ej: 18" required />
        <span *ngIf="addForm.get('taxPercentage')?.invalid && addForm.get('taxPercentage')?.touched" class="text-xs text-red-500">
          * Obligatorio (De 0 a 100).
        </span>
      </div>

      <div class="flex flex-col gap-y-2 sm:col-span-1">
        <label class="text-sm font-medium">
          Fecha de Vigencia
          <span class="text-red-500 ml-0.5">*</span>
        </label>
        <input type="date" formControlName="effectiveDate"
          class="border border-gray-200 rounded-md px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" required />
        <span *ngIf="addForm.get('effectiveDate')?.invalid && addForm.get('effectiveDate')?.touched" class="text-xs text-red-500">
          * Fecha obligatoria.
        </span>
      </div>

    </div>

    <!-- Footer del modal -->
    <div class="flex justify-end items-center gap-x-2 py-3 px-4">
      <button type="reset"
        class="py-2 px-3 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg bg-white border border-gray-200 hover:bg-gray-100 disabled:opacity-50 disabled:pointer-events-none"
        data-hs-overlay="#hs-scale-animation-modal">
        Cancelar
      </button>
      <button type="submit" [disabled]="addForm.invalid || isLoading"
        class="py-2 px-3 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg bg-blue-600 border border-blue-600 text-white hover:bg-blue-700 focus:outline-hidden focus:bg-blue-700 disabled:opacity-50 disabled:pointer-events-none">
        <span *ngIf="isLoading" class="animate-spin inline-block size-4 border-2 border-current border-t-transparent text-white rounded-full" role="status" aria-label="loading"></span>
        {{ isLoading ? 'Registrando...' : 'Registrar' }}
      </button>
    </div>
  </form>
</div>
