<div class="hs-overlay-animation-target hs-overlay-open:scale-100 hs-overlay-open:opacity-100 scale-95 opacity-0 ease-in-out transition-all duration-200 sm:max-w-lg sm:w-full m-3 sm:mx-auto min-h-[calc(100%-56px)] flex items-center">
  <form [formGroup]="addForm" (ngSubmit)="onSubmit()" class="w-full flex flex-col bg-white border border-gray-300 shadow-2xs rounded-xl pointer-events-auto">

    <!-- Header del modal -->
    <div class="flex justify-between items-center py-3 px-4 border-b border-gray-200">
      <h3 id="hs-scale-animation-modal-label" class="font-medium">Registrar nueva lectura</h3>
      <button type="button" #closeButton
        class="size-8 inline-flex justify-center items-center gap-x-2 rounded-full bg-gray-100 text-gray-800 hover:bg-gray-200 focus:outline-hidden focus:bg-gray-300 disabled:opacity-50 disabled:pointer-events-none"
        aria-label="Close" data-hs-overlay="#hs-scale-animation-modal">
        <span class="sr-only">Close</span>
        <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18"></path>
          <path d="m6 6 12 12"></path>
        </svg>
      </button>
    </div>

    <!-- Contenido del modal -->
    <div class="px-4 py-4 overflow-y-auto flex flex-col gap-y-4">

      <!-- Búsqueda de Suministro -->
      <div class="flex flex-col gap-y-2">
        <label class="text-sm font-medium">
          Suministro
          <span class="text-red-500 ml-0.5">*</span>
        </label>

        <div [formGroup]="searchSupplyForm" class="relative">
          <input type="text"
            formControlName="supplyNumber"
            [readonly]="selectedSupply !== null"
            class="w-full border border-gray-200 rounded-md px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent pr-16"
            placeholder="Escriba código de suministro (mín. 3 caracteres)" />

          <!-- Loading indicator -->
          <div *ngIf="isSearching" class="absolute right-3 top-2.5">
            <svg lucideLoader class="animate-spin size-4 text-gray-400"></svg>
          </div>

          <!-- Clear selection button -->
          <button type="button"
            *ngIf="selectedSupply !== null"
            (click)="resetSupplySelection()"
            class="absolute right-3 top-2.5 text-xs text-red-500 font-semibold hover:underline">
            Cambiar
          </button>
        </div>

        <!-- Dropdown con resultados de búsqueda -->
        <div *ngIf="supplies.length > 0 && selectedSupply === null" class="border border-gray-200 rounded-md bg-white shadow-lg overflow-hidden max-h-48 overflow-y-auto">
          <button type="button"
            *ngFor="let supply of supplies"
            (click)="selectSupply(supply)"
            class="w-full text-left px-4 py-2 text-sm hover:bg-blue-50 hover:text-blue-700 flex flex-col border-b border-gray-100 last:border-b-0 transition-colors">
            <span class="font-medium text-blue-600">Suministro: {{ supply.supplyNumber }}</span>
            <span class="text-xs text-gray-500">Cliente: {{ supply.customerName }} | Medidor: {{ supply.meterNumber }}</span>
          </button>
        </div>

        <!-- Información de suministro seleccionado -->
        <div *ngIf="selectedSupply" class="bg-blue-50/50 rounded-lg p-3 border border-blue-100 space-y-1.5 text-xs">
          <div class="flex justify-between">
            <span class="text-gray-500">Cliente:</span>
            <span class="font-medium text-gray-900">{{ selectedSupply.customerName }}</span>
          </div>
          <div class="flex justify-between">
            <span class="text-gray-500">Medidor:</span>
            <span class="font-medium text-gray-900">{{ selectedSupply.meterNumber }}</span>
          </div>
          <div class="flex justify-between">
            <span class="text-gray-500">Última Lectura:</span>
            <span class="font-semibold text-blue-700">{{ selectedSupply.lastReading }} m³</span>
          </div>
        </div>
      </div>

      <!-- Lectura Actual -->
      <div class="flex flex-col gap-y-2">
        <label class="text-sm font-medium">
          Lectura Actual (m³)
          <span class="text-red-500 ml-0.5">*</span>
        </label>
        <input type="text"
          formControlName="currentReading"
          (keypress)="allowOnlyNumbers($event)"
          class="border border-gray-200 rounded-md px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          placeholder="Ingrese la lectura actual" required />
        <span *ngIf="addForm.get('currentReading')?.invalid && addForm.get('currentReading')?.touched" class="text-xs text-red-500">
          * La lectura actual es obligatoria y debe ser un número positivo.
        </span>
      </div>

      <!-- Foto Medidor -->
      <div class="flex flex-col gap-y-2">
        <label class="text-sm font-medium">
          Foto del medidor
          <span class="text-red-500 ml-0.5">*</span>
          <span class="text-gray-700 text-xs ml-0.5 font-normal">(La imagen debe pesar max. 1MB)</span>
        </label>
        <input type="file" accept="image/*"
          (change)="onFileChange($event)"
          class="text-sm w-full contain-content rounded-lg border file:border-r file:border-gray-200 border-gray-200 file:text-sm file:py-2 file:px-4 file:focus:outline-blue-500 file:mr-4 file:text-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent hover:cursor-pointer hover:file:cursor-pointer">

        <div *ngIf="imagePreview" class="relative w-24 h-24 mt-2 rounded-md overflow-hidden border border-gray-200 font-normal">
          <img [src]="imagePreview" alt="Preview" class="w-full h-full object-cover" />
        </div>
      </div>

      <!-- Observaciones -->
      <div class="flex flex-col gap-y-2">
        <label class="text-sm font-medium">Observaciones</label>
        <textarea
          formControlName="observations"
          rows="3"
          class="border border-gray-200 rounded-md px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none"
          placeholder="Ingrese observaciones o anomalías si existen..."></textarea>
      </div>

    </div>

    <!-- Footer del modal -->
    <div class="flex justify-end items-center gap-x-2 py-3 px-4 border-t border-gray-100">
      <button type="button"
        class="py-2 px-3 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg bg-white border border-gray-200 hover:bg-gray-100"
        data-hs-overlay="#hs-scale-animation-modal"
        (click)="resetSupplySelection()">
        Cancelar
      </button>
      <button type="submit" [disabled]="addForm.invalid || isLoading"
        class="py-2 px-3 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg bg-blue-600 border border-blue-600 text-white hover:bg-blue-700 disabled:opacity-50">
        <span *ngIf="isLoading" class="animate-spin inline-block size-4 border-2 border-current border-t-transparent text-white rounded-full" role="status" aria-label="loading"></span>
        {{ isLoading ? 'Registrando...' : 'Registrar' }}
      </button>
    </div>
  </form>
</div>
