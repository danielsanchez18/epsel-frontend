<section class="flex flex-col gap-y-7">
  
  <!-- KPI Component -->
  <component-dashboard-incidents-kpis 
    [total]="kpiTotal" 
    [open]="kpiOpen" 
    [inProgress]="kpiInProgress" 
    [resolved]="kpiResolved" />

  <div class="lg:border border-gray-200 lg:rounded-xl lg:p-5 flex flex-col gap-6 bg-white shadow-2xs">
    
    <!-- Filter bar -->
    <div class="flex flex-col gap-4">
      <div class="flex flex-col md:flex-row items-stretch md:items-center justify-between gap-4">
        <!-- Search Box -->
        <component-shared-search-box class="w-full md:max-w-md"
          placeholder="Buscar incidencia por Código, Cliente o Título..." [searchQuery]="searchQuery"
          (searchQueryChange)="onSearchQuery($event)" />

        <!-- Export & Filters -->
        <div class="flex items-center gap-x-1">
          <component-shared-export (onExport)="handleExport($event)" />
          <component-shared-filters [activeFiltersCount]="activeFiltersCount" offcanvasId="incidents-filter-offcanvas">
            
            <form [formGroup]="filterForm" (ngSubmit)="applyFilters()" class="flex flex-col gap-y-5">
              
              <!-- Tipo -->
              <div class="space-y-2">
                <label class="text-sm font-medium text-gray-800">Tipo de Incidencia</label>
                <select formControlName="type" class="w-full border border-gray-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white text-gray-700">
                  <option value="">Todos los tipos</option>
                  <option value="BILLING_COMPLAINT">Facturación</option>
                  <option value="PAYMENT_COMPLAINT">Pago no aplicado</option>
                  <option value="SERVICE_INTERRUPTION">Interrupción</option>
                  <option value="LOW_PRESSURE">Baja Presión</option>
                  <option value="WATER_LEAK">Fuga de Agua</option>
                  <option value="METER_DAMAGE">Medidor Dañado</option>
                  <option value="METER_REPLACEMENT">Reemplazo Medidor</option>
                  <option value="ABNORMAL_CONSUMPTION">Consumo Anormal</option>
                  <option value="OCR_ANOMALY">Anomalía OCR</option>
                  <option value="SUPPLY_CUT_COMPLAINT">Reclamo por Corte</option>
                  <option value="OTHER">Otros</option>
                </select>
              </div>

              <!-- Estado -->
              <div class="space-y-2">
                <label class="text-sm font-medium text-gray-800">Estado</label>
                <select formControlName="status" class="w-full border border-gray-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white text-gray-700">
                  <option value="">Todos los estados</option>
                  <option value="OPEN">Abiertas</option>
                  <option value="IN_PROGRESS">En proceso</option>
                  <option value="RESOLVED">Resueltas</option>
                  <option value="CLOSED">Cerradas</option>
                  <option value="REJECTED">Rechazadas</option>
                </select>
              </div>

              <!-- Prioridad -->
              <div class="space-y-2">
                <label class="text-sm font-medium text-gray-800">Prioridad</label>
                <select formControlName="priority" class="w-full border border-gray-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white text-gray-700">
                  <option value="">Todas las prioridades</option>
                  <option value="LOW">Baja</option>
                  <option value="MEDIUM">Media</option>
                  <option value="HIGH">Alta</option>
                  <option value="CRITICAL">Crítica</option>
                </select>
              </div>

              <!-- Fechas -->
              <div class="space-y-2">
                <label class="text-sm font-medium text-gray-800">Fecha Desde</label>
                <input type="date" formControlName="startDate" class="w-full border border-gray-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white text-gray-700" />
              </div>
              <div class="space-y-2">
                <label class="text-sm font-medium text-gray-800">Fecha Hasta</label>
                <input type="date" formControlName="endDate" class="w-full border border-gray-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white text-gray-700" />
              </div>

              <!-- Botones de Acción -->
              <div class="flex items-center gap-x-2 pt-4 border-t border-gray-100 mt-2">
                <button type="button" (click)="clearFilters()" data-hs-overlay="#incidents-filter-offcanvas"
                  class="w-full py-2 px-3 inline-flex justify-center items-center gap-x-2 text-sm font-medium rounded-lg border border-gray-200 bg-white text-gray-800 shadow-sm hover:bg-gray-50 disabled:opacity-50 disabled:pointer-events-none">
                  Limpiar
                </button>
                <button type="submit" data-hs-overlay="#incidents-filter-offcanvas"
                  class="w-full py-2 px-3 inline-flex justify-center items-center gap-x-2 text-sm font-semibold rounded-lg border border-transparent bg-blue-600 text-white hover:bg-blue-700 disabled:opacity-50 disabled:pointer-events-none">
                  Aplicar
                </button>
              </div>

            </form>

          </component-shared-filters>
        </div>
      </div>
    </div>

    <!-- Loading State -->
    <div *ngIf="isLoading" class="flex justify-center py-10">
      <div
        class="animate-spin inline-block size-6 border-2 border-current border-t-transparent text-blue-600 rounded-full"
        role="status" aria-label="loading"></div>
    </div>

    <!-- Table Component -->
    <component-dashboard-incidents-table *ngIf="!isLoading && incidents.length > 0" [items]="incidents" />

    <!-- Empty State Component -->
    <component-dashboard-incidents-empty *ngIf="!isLoading && incidents.length === 0" />

    <!-- Paginator Component -->
    <component-shared-paginator *ngIf="!isLoading && totalPages > 1" [page]="currentPage" [totalPages]="totalPages"
      [totalElements]="totalElements" (pageChange)="onPageChange($event)" />

  </div>
</section>
