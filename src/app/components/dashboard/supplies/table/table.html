<section class="overflow-x-hidden hover:overflow-x-auto">
  <div class="min-w-full inline-block align-middle">
    <div class="overflow-hidden">
      <table class="min-w-full">
        <thead>
          <tr class="bg-gray-100 text-sm">
            <th scope="col" class="px-6 py-3 text-nowrap font-semibold text-xs uppercase text-start">Código suministro</th>
            <th scope="col" class="px-6 py-3 text-nowrap font-semibold text-xs uppercase text-start">Cliente</th>
            <th scope="col" class="px-6 py-3 text-nowrap font-semibold text-xs uppercase text-start">Estado</th>
            <th scope="col" class="px-6 py-3 text-nowrap font-semibold text-xs uppercase text-start">Última lectura</th>
            <th scope="col" class="px-6 py-3 text-nowrap font-semibold text-xs uppercase text-start">Tipo</th>
            <th scope="col" class="px-6 py-3 text-nowrap font-semibold text-xs uppercase text-start">Ubicación</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-200">
          <tr *ngFor="let item of items" [routerLink]="[item.id]" class="group hover:bg-gray-50 hover:cursor-pointer max-xl:w-full">
            <td class="px-6 py-2.5 text-sm font-medium text-blue-600 group-hover:underline text-nowrap">{{ item.supplyNumber }}</td>
            <td class="px-6 py-2.5 text-sm max-w-48 truncate">
              <div class="flex flex-col">
                <span class="font-medium truncate">{{ item.customerName }}</span>
              </div>
            </td>
            <td class="px-6 py-2.5 text-sm text-nowrap">
              <span class="inline-flex items-center px-2.5 py-1.5 rounded-lg text-[13px] font-medium" [ngClass]="getStatusClass(item.status)">
                {{ getStatusLabel(item.status) }}
              </span>
            </td>
            <td class="px-6 py-2.5 text-sm text-nowrap">{{ item.lastReading ?? '-' }}</td>
            <td class="px-6 py-2.5 text-sm max-w-48 truncate">
              <div class="flex items-center gap-x-2 font-medium text-[13px] bg-gray-100 rounded-lg px-3 py-2 w-fit">
                <svg *ngIf="getTypeIcon(item.supplyType) === 'house'" lucideHouse class="size-4"></svg>
                <svg *ngIf="getTypeIcon(item.supplyType) === 'store'" lucideStore class="size-4"></svg>
                <svg *ngIf="getTypeIcon(item.supplyType) === 'building'" lucideBuilding2 class="size-4"></svg>
                {{ getTypeLabel(item.supplyType) }}
              </div>
            </td>
            <td class="px-6 py-2.5 text-sm max-w-48 truncate">
              <p>{{ item.propertyAddress }}</p>
              <p class="text-xs text-gray-500 truncate">{{ item.zoneName }}</p>
            </td>
          </tr>
          <tr *ngIf="items.length === 0">
            <td colspan="6" class="px-6 py-8 text-center text-sm text-gray-500">No hay suministros para mostrar.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
