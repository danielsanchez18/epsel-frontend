<section class="flex flex-col gap-5 border border-gray-200 bg-white overflow-hidden rounded-xl p-5">

  <div class="flex items-center gap-x-3">
    <select
      class="max-w-xs w-full border border-gray-200 rounded-md px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
      (change)="onFilterChange($event)">
      <option value="">Todos los servicios</option>
      <option value="INSTALLATION">Instalación</option>
      <option value="RECONNECTION">Reconexión</option>
      <option value="CUT">Corte</option>
      <option value="PENALTY">Multa</option>
    </select>

    <button class="ml-auto flex items-center gap-x-1 font-medium text-sm bg-blue-600 hover:bg-blue-700 text-white rounded-lg px-3 py-2 w-fit"
      aria-haspopup="dialog" aria-expanded="false" aria-controls="hs-scale-animation-modal" data-hs-overlay="#hs-scale-animation-modal">
      Nuevo Costo
    </button>
  </div>

  <!-- Tabla de zonas operativas -->
  <div class="overflow-x-auto" *ngIf="costs.length > 0; else emptyState">
    <table class="min-w-full">
      <thead>
        <tr class="bg-gray-100 text-sm">
          <th class="py-3 px-6 font-semibold text-nowrap text-xs uppercase text-start">Tipo de Servicio</th>
          <th class="py-3 px-6 font-semibold text-nowrap text-xs uppercase text-start">Zona Asociada</th>
          <th class="py-3 px-6 font-semibold text-nowrap text-xs uppercase text-start">Monto</th>
          <th class="py-3 px-6 font-semibold text-nowrap text-xs uppercase text-start">Estado</th>
          <th class="py-3 px-6 font-semibold text-nowrap text-xs uppercase text-right">Acciones</th>
        </tr>
      </thead>
      <tbody class="text-sm divide-y divide-gray-200">
        <tr class="group hover:bg-gray-50" *ngFor="let cost of costs">
          <td class="py-3 px-6">
            <div class="flex items-center gap-x-1 font-medium text-[13px] bg-gray-100 rounded-lg px-3 py-2 w-fit">
              <svg *ngIf="cost.feeType === 'INSTALLATION'" lucideSettings class="size-4"></svg>
              <svg *ngIf="cost.feeType === 'RECONNECTION'" lucideCable class="size-4"></svg>
              <svg *ngIf="cost.feeType === 'CUT'" lucideScissors class="size-4"></svg>
              <svg *ngIf="cost.feeType === 'PENALTY'" lucideCircleDollarSign class="size-4"></svg>
              <svg *ngIf="cost.feeType === 'OTHER' || !cost.feeType" lucideMoreHorizontal class="size-4"></svg>
              {{ getFeeLabel(cost.feeType) }}
            </div>
          </td>
          <td class="py-3 px-6 text-nowrap">{{ cost.zoneName }}</td>
          <td class="py-3 px-6 text-nowrap text-blue-600 font-medium">S/ {{ cost.amount.toFixed(2) }}</td>
          <td class="py-3 px-6">
            <div class="flex items-center gap-x-1 font-medium text-[13px] px-3 py-2 w-fit rounded-lg"
              [ngClass]="cost.active ? 'text-green-600 bg-green-50' : 'text-red-500 bg-red-50'">
              <svg [class]="cost.active ? 'size-4' : 'hidden'" lucideBadgeCheck></svg>
              <svg [class]="!cost.active ? 'size-4' : 'hidden'" lucideBadgeX></svg>
              {{ cost.active ? 'Activo' : 'Inactivo' }}
            </div>
          </td>
          <td class="py-3 px-6">
            <div class="flex items-center justify-end gap-x-1">
              <button class="flex items-center gap-x-1 font-medium text-[13px] border border-gray-200 bg-gray-100 hover:bg-gray-200 rounded-lg px-2 py-2 w-fit"
                (click)="openEdit(cost)"
                aria-haspopup="dialog" aria-expanded="false" aria-controls="hs-edit-modal" data-hs-overlay="#hs-edit-modal"
                title="Editar costo">
                <svg lucideSquarePen class="size-4" />
              </button>
              <button *ngIf="cost.active" class="flex items-center gap-x-1 font-medium text-[13px] text-red-500 border border-red-100 bg-red-50 hover:bg-red-100 rounded-lg px-2 py-2 w-fit"
                (click)="changeStatus(cost, false)"
                title="Deshabilitar costo">
                <svg lucideBadgeX class="size-4" />
              </button>
              <button *ngIf="!cost.active" class="flex items-center gap-x-1 font-medium text-[13px] text-green-500 border border-green-100 bg-green-50 hover:bg-green-100 rounded-lg px-2 py-2 w-fit"
                (click)="changeStatus(cost, true)"
                title="Habilitar costo">
                <svg lucideBadgeCheck class="size-4" />
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <ng-template #emptyState>
    <div *ngIf="!isLoading" class="flex flex-col items-center justify-center py-10">
      <img src="/images/empty.png" alt="No hay resultados" class="w-40 h-40 object-contain drop-shadow-sm mb-4">
      <p class="text-gray-500 font-medium">No se encontraron costos de servicio.</p>
    </div>
    <div *ngIf="isLoading" class="flex justify-center py-10">
      <span class="animate-spin inline-block size-6 border-2 border-current border-t-transparent text-blue-600 rounded-full" role="status" aria-label="loading"></span>
    </div>
  </ng-template>

  <component-shared-paginator
    *ngIf="costs.length > 0"
    [page]="page"
    [totalPages]="totalPages"
    [totalElements]="totalElements"
    (pageChange)="onPageChange($event)"
  />

</section>

<!-- Modal de agregar zona -->
<div id="hs-scale-animation-modal"
  class="hs-overlay hidden size-full fixed top-0 inset-s-0 z-80 overflow-x-hidden overflow-y-auto pointer-events-none"
  role="dialog" tabindex="-1" aria-labelledby="hs-scale-animation-modal-label">
  <component-dashboard-settings-service-costs-add />
</div>

<!-- Modal de editar zona -->
<div id="hs-edit-modal"
  class="hs-overlay hidden size-full fixed top-0 inset-s-0 z-80 overflow-x-hidden overflow-y-auto pointer-events-none"
  role="dialog" tabindex="-1" aria-labelledby="hs-edit-modal-label">
  <component-dashboard-settings-service-costs-edit />
</div>
