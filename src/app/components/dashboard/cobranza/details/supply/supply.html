<article class="bg-white rounded-xl border border-gray-200 p-5 flex flex-col gap-4 w-full">
  <div class="flex items-center gap-x-2 border-b border-gray-100 pb-3">
    <div class="p-1.5 bg-blue-50 text-blue-600 rounded-lg">
      <svg lucideDroplet class="size-5"></svg>
    </div>
    <h2 class="font-semibold text-sm text-gray-900">Información del Suministro</h2>
  </div>

  <div class="grid grid-cols-1 gap-y-3 text-sm">
    <div class="flex flex-col gap-0.5">
      <span class="text-xs text-gray-500 font-medium">Número Suministro</span>
      <span class="font-semibold text-blue-600">{{ billing?.supplyNumber }}</span>
    </div>
    <div class="flex flex-col gap-0.5">
      <span class="text-xs text-gray-500 font-medium">Número de Medidor</span>
      <span class="font-medium text-gray-900">{{ supply?.meterNumber || 'No registrado' }}</span>
    </div>
    <div class="flex flex-col gap-0.5">
      <span class="text-xs text-gray-500 font-medium">Dirección del Predio</span>
      <span class="font-medium text-gray-900 truncate" [title]="billing?.propertyAddress">{{ billing?.propertyAddress }}</span>
    </div>
  </div>
</article>
