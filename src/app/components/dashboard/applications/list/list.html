<section class="lg:border border-gray-200 lg:rounded-xl lg:p-5 flex flex-col gap-10">

  <div class="flex items-center justify-between gap-2">

    <component-shared-search-box
      class="w-full md:max-w-md"
      placeholder="Buscar solicitudes por zona o cliente"
      [searchQuery]="searchQuery"
      (searchQueryChange)="onSearchQuery($event)"
    />

    <div class="flex items-center gap-x-1">
      <component-shared-import />
      <component-shared-filters />
    </div>

  </div>

  <component-dashboard-applications-table
    [items]="requests"
    *ngIf="requests.length > 0"
  />

  <component-dashboard-applications-empty
    *ngIf="requests.length === 0 && !isLoading"
    [title]="searchQuery ? 'No se encontraron resultados' : 'No tienes solicitudes registradas'"
    [message]="searchQuery ? 'Intenta ajustando los términos de búsqueda' : 'Registra una nueva solicitud para empezar a gestionar tu sistema'"
  />

  <component-shared-paginator
    [page]="currentPage"
    [totalPages]="totalPages"
    [totalElements]="totalElements"
    (pageChange)="onPageChange($event)"
  />

</section>
