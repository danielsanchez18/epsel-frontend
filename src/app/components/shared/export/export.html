<div class="hs-dropdown relative inline-flex">
  <button id="hs-export-dropdown" type="button" class="hs-dropdown-toggle flex items-center gap-x-1 hover:shadow hover:bg-gray-50 rounded-lg px-2 py-2 border border-gray-200 bg-white transition-colors focus:outline-0">
    <svg lucideDownload class="w-3.5 h-3.5"></svg>
    <span class="text-[13px] font-medium">Exportar</span>
  </button>

  <div class="hs-dropdown-menu transition-[opacity,margin] duration hs-dropdown-open:opacity-100 opacity-0 hidden min-w-[200px] bg-white shadow-md rounded-lg p-2 mt-2 after:h-4 after:absolute after:-bottom-4 after:start-0 after:w-full before:h-4 before:absolute before:-top-4 before:start-0 before:w-full border border-gray-200 z-50" aria-labelledby="hs-export-dropdown">
    
    <div class="py-1 px-3">
      <span class="block text-xs font-semibold text-gray-400 uppercase">Exportar Página Actual</span>
    </div>
    <button (click)="triggerExport('CURRENT_PAGE', 'CSV')" class="w-full flex items-center gap-x-2.5 py-2 px-3 rounded-md text-sm text-gray-800 hover:bg-gray-100 focus:outline-none focus:bg-gray-100">
      <svg lucideFileText class="w-4 h-4"></svg>
      Formato CSV
    </button>
    <button (click)="triggerExport('CURRENT_PAGE', 'EXCEL')" class="w-full flex items-center gap-x-2.5 py-2 px-3 rounded-md text-sm text-gray-800 hover:bg-gray-100 focus:outline-none focus:bg-gray-100">
      <svg lucideFileSpreadsheet class="w-4 h-4"></svg>
      Formato Excel (.xlsx)
    </button>

    <div class="my-1 border-t border-gray-100"></div>

    <div class="py-1 px-3">
      <span class="block text-xs font-semibold text-gray-400 uppercase">Exportar Todo (Con Filtros)</span>
    </div>
    <button (click)="triggerExport('ALL_RECORDS', 'CSV')" class="w-full flex items-center gap-x-2.5 py-2 px-3 rounded-md text-sm text-gray-800 hover:bg-gray-100 focus:outline-none focus:bg-gray-100">
      <svg lucideFileText class="w-4 h-4"></svg>
      Formato CSV
    </button>
    <button (click)="triggerExport('ALL_RECORDS', 'EXCEL')" class="w-full flex items-center gap-x-2.5 py-2 px-3 rounded-md text-sm text-gray-800 hover:bg-gray-100 focus:outline-none focus:bg-gray-100">
      <svg lucideFileSpreadsheet class="w-4 h-4"></svg>
      Formato Excel (.xlsx)
    </button>
    
  </div>
</div>
