<main class="flex flex-col gap-y-7 px-4 md:px-7 lg:px-10">

  <div class="flex items-center gap-x-2">

    <!-- Título y descripción -->
    <div>
      <h1 class="text-lg font-medium">Clientes</h1>
      <p class="text-sm text-gray-700">Administra los clientes del sistema.</p>
    </div>

    <button
      type="button"
      class="ml-auto rounded-lg font-medium bg-blue-500 text-white text-sm hover:bg-blue-600 px-3 py-2 transition-colors duration-200"
      aria-haspopup="dialog" aria-expanded="false" aria-controls="hs-scale-animation-modal" data-hs-overlay="#hs-scale-animation-modal">
      Agregar
    </button>

  </div>

  <component-dashboard-customers-kpis />
  <component-dashboard-customers-list />


  <!-- Modal de agregar cliente -->
  <div id="hs-scale-animation-modal"
    class="hs-overlay hidden size-full fixed top-0 inset-s-0 z-80 overflow-x-hidden overflow-y-auto pointer-events-none"
    role="dialog" tabindex="-1" aria-labelledby="hs-scale-animation-modal-label">
    <component-dashboard-customers-add />
  </div>

</main>
