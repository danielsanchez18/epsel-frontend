<section class="p-5 border border-gray-200 rounded-2xl bg-white grid gap-5 shadow-2xs">

  <!-- Header -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-gray-100 pb-4">
    <div>
      <h2 class="text-base font-medium">Documentos del Predio</h2>
      <p class="text-sm text-gray-700">Archivos y documentos asociados a este predio.</p>
    </div>

    <button
      class="text-sm px-3.5 py-2 font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg inline-flex items-center gap-x-1.5 transition-colors cursor-pointer shadow-xs whitespace-nowrap"
      disabled>
      <svg lucideUpload class="size-4"></svg>
      Subir documento
    </button>
  </div>

  <!-- Loading State -->
  <div *ngIf="isLoading" class="flex justify-center py-10">
    <div
      class="animate-spin inline-block size-6 border-[3px] border-current border-t-transparent text-blue-600 rounded-full"
      role="status"></div>
  </div>

  <!-- Empty State -->
  <div *ngIf="!isLoading && documents.length === 0"
    class="text-center py-14 bg-gray-50 rounded-xl border border-dashed border-gray-200">
    <svg lucideFileText class="size-10 text-gray-400 mx-auto mb-3 stroke-[1.3]"></svg>
    <p class="text-sm text-gray-700 font-medium">No hay documentos adjuntos</p>
    <p class="text-xs text-gray-400 mt-1">Cuando se suban documentos asociados a este predio, aparecerán aquí.</p>
  </div>

</section>
