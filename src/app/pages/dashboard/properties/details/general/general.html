<main class="flex flex-col gap-y-7 px-4 md:px-7 lg:px-10">

  <!-- Título y descripción -->
  <div class="space-y-1">
    <a routerLink=".." class="font-medium text-sm text-blue-600 hover:underline">Regresar</a>
    <h1 class="text-lg font-medium">{{ property?.address || 'Detalles del Predio' }}</h1>
  </div>

  <!-- Tabs -->
  <div class="flex gap-x-1">
    <a
      routerLink="/dashboard/predios/{{ propertyId }}"
      routerLinkActive="text-white! bg-blue-600! hover:bg-blue-700!"
      [routerLinkActiveOptions]="{ exact: true }"
      class="py-2 px-3 text-sm border-b-2 border-transparent font-medium bg-gray-100 hover:bg-gray-200 rounded-lg text-gray-700 hover:text-black"
    >
      General
    </a>
    @for (route of routes; track $index) {
      <a
        routerLink="{{ route.path }}"
        routerLinkActive="text-white! bg-blue-600! hover:bg-blue-700!"
        class="py-2 px-3 text-sm border-b-2 border-transparent font-medium bg-gray-100 hover:bg-gray-200 rounded-lg text-gray-700 hover:text-black"
      >
        {{ route.name }}
      </a>
    }

  </div>

  <router-outlet />


</main>
