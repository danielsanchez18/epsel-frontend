<div class="flex flex-col sm:flex-row sm:items-center justify-between mb-4 gap-3">
  <div>
    <h2 class="text-base font-semibold text-gray-800">Resumen de Pagos</h2>
  </div>
  <div class="flex items-center gap-2">
    <select
      [(ngModel)]="selectedPeriod"
      (ngModelChange)="onPeriodChange()"
      class="block w-full sm:w-48 py-2 px-3 border border-gray-200 rounded-lg text-sm focus:border-blue-500 focus:ring-blue-500 disabled:opacity-50 disabled:pointer-events-none bg-white text-gray-700 font-medium shadow-xs"
    >
      <option *ngFor="let period of periods" [value]="period.value">
        {{ period.label }}
      </option>
    </select>
  </div>
</div>

<section class="grid sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-5 gap-4">

  <!-- Total Hoy -->
  <article class="w-full bg-white py-5 space-y-2 px-5 rounded-xl border border-gray-200 shadow-xs">
    <div class="flex text-sm text-gray-600 items-center justify-between">
      <h3>Total Hoy</h3>
      <svg lucideCalendar class="size-5 stroke-[1.5]" />
    </div>
    <div class="space-y-1">
      <p class="font-medium text-xl">S/. {{ totalToday.toFixed(2) }}</p>
    </div>
  </article>

  <!-- Total Mes -->
  <article class="w-full bg-white py-5 space-y-2 px-5 rounded-xl border border-gray-200 shadow-xs">
    <div class="flex text-sm text-gray-600 items-center justify-between">
      <h3>Total Mes</h3>
      <svg lucideBadgeDollarSign class="size-5 stroke-[1.5]" />
    </div>
    <div class="space-y-1">
      <p class="font-medium text-xl">S/. {{ totalMonth.toFixed(2) }}</p>
    </div>
  </article>

  <!-- Efectivo -->
  <article class="w-full bg-white py-5 space-y-2 px-5 rounded-xl border border-gray-200 shadow-xs">
    <div class="flex text-sm text-gray-600 items-center justify-between">
      <h3>Efectivo</h3>
      <svg lucideHandCoins class="size-5 stroke-[1.5]" />
    </div>
    <div class="space-y-1">
      <p class="font-medium text-xl">S/. {{ totalCash.toFixed(2) }}</p>
    </div>
  </article>

  <!-- Yape -->
  <article class="w-full bg-white py-5 space-y-2 px-5 rounded-xl border border-gray-200 shadow-xs">
    <div class="flex text-sm text-gray-600 items-center justify-between">
      <h3>Yape</h3>
      <svg lucideSmartphone class="size-5 stroke-[1.5]" />
    </div>
    <div class="space-y-1">
      <p class="font-medium text-xl">S/. {{ totalYape.toFixed(2) }}</p>
    </div>
  </article>

  <!-- Transferencias -->
  <article class="w-full bg-white py-5 space-y-2 px-5 rounded-xl border border-gray-200 shadow-xs">
    <div class="flex text-sm text-gray-600 items-center justify-between">
      <h3>Transferencias</h3>
      <svg lucideCreditCard class="size-5 stroke-[1.5]" />
    </div>
    <div class="space-y-1">
      <p class="font-medium text-xl">S/. {{ totalTransfer.toFixed(2) }}</p>
    </div>
  </article>

</section>
