<div class="bg-white rounded-2xl border border-gray-200 p-5 space-y-7 flex flex-col h-[400px]">

  <!-- Header -->
  <div class="flex items-center justify-between ">
    <div class="flex gap-x-3">
      <svg lucideBadgeAlert class="size-6 mt-0.5 stroke-[1.5] text-gray-600" />
      <div>
        <h2 class="text-sm font-medium">Alertas del Sistema</h2>
        <p class="text-xs text-gray-500">Incidentes y pendientes que requieren atención</p>
      </div>
    </div>
    <span *ngIf="!isLoading && alerts.length > 0"
      class="px-2.5 py-1.5 text-[13px] font-medium bg-red-50 text-red-600 rounded-md">
      {{ alerts.length }} {{ alerts.length === 1 ? 'Activa' : 'Activas' }}
    </span>
  </div>

  <!-- Content / Skeleton Loading -->
  <div class="flex-1 overflow-y-auto space-y-1 pr-1 custom-scrollbar">
    <ng-container *ngIf="isLoading; else alertsList">
      <div *ngFor="let item of [1, 2, 3]"
        class="p-4 bg-gray-50 rounded-xl border border-gray-100 animate-pulse flex gap-x-3">
        <div class="size-5 bg-gray-200 rounded-full"></div>
        <div class="flex-1 space-y-2">
          <div class="h-4 bg-gray-200 rounded-md w-1/3"></div>
          <div class="h-3 bg-gray-200 rounded-md w-2/3"></div>
        </div>
      </div>
    </ng-container>

    <ng-template #alertsList>
      <ng-container *ngIf="alerts.length > 0; else emptyState">
        <div *ngFor="let alert of alerts" [ngClass]="{
               'bg-red-100/50 text-red-600': alert.severity === 'HIGH',
               'bg-orange-100/50 text-orange-600': alert.severity === 'MEDIUM',
               'bg-amber-100/60 text-amber-600': alert.severity === 'LOW'
             }" class="flex gap-x-3.5 px-4 py-3 rounded-md"
          [style.border-left-color]="alert.severity === 'HIGH' ? '#ef4444' : alert.severity === 'MEDIUM' ? '#f97316' : '#eab308'">

          <!-- Severity Icon -->
          <div class="shrink-0 mt-0.5">
            <svg *ngIf="alert.severity === 'HIGH'" lucideBadgeAlert class="size-5 text-red-600" />
            <svg *ngIf="alert.severity === 'MEDIUM'" lucideWrench class="size-5 text-orange-600" />
            <svg *ngIf="alert.severity === 'LOW'" lucideInfo class="size-5 text-amber-600" />
          </div>

          <!-- Alert Details -->
          <div class="flex-1">
            <h4 class="text-sm font-medium">{{ alert.title }}</h4>
            <p class="text-[13px] text-black">{{ alert.description }}</p>
          </div>
        </div>
      </ng-container>

      <ng-template #emptyState>
        <div class="flex flex-col items-center justify-center h-full text-center space-y-3 py-6">
          <div class="p-4 bg-emerald-50 text-emerald-600 rounded-full">
            <svg lucideCheckCircle2 class="size-10 stroke-[1.5]" />
          </div>
          <div class="space-y-1 max-w-sm">
            <h3 class="text-sm font-semibold text-gray-800">¡Todo en orden!</h3>
            <p class="text-xs text-gray-500 leading-relaxed">No hay alertas críticas en el sistema. Todos los
              suministros y procesos operan con normalidad.</p>
          </div>
        </div>
      </ng-template>
    </ng-template>
  </div>
</div>
