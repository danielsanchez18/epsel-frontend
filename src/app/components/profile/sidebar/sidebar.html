<div class="flex flex-col gap-y-0.5 min-w-70 pr-5 border-r border-gray-200 h-full">

    <h3 class="font-medium mb-5">Mi Perfil</h3>

    <a routerLink="/perfil" routerLinkActive="bg-gray-100! text-black!" [routerLinkActiveOptions]="{exact: true}"
        class="px-2.5 py-2.5 text-sm flex items-center gap-x-3 rounded-lg text-gray-800 hover:bg-gray-100 hover:text-black">
        <svg lucideUser class="size-4" />
        Información Personal
    </a>

    <a routerLink="seguridad" routerLinkActive="bg-gray-100! text-black!"
        class="px-2.5 py-2.5 text-sm flex items-center gap-x-3 rounded-lg text-gray-800 hover:bg-gray-100 hover:text-black">
        <svg lucideLock class="size-4" />
        Seguridad
    </a>

    <!-- <a routerLink="configuraciones" routerLinkActive="bg-gray-100! text-black!"
        class="px-2.5 py-2.5 text-sm flex items-center gap-x-3 rounded-lg text-gray-800 hover:bg-gray-100 hover:text-black">
        <svg lucideSettings class="size-4" />
        Configuraciones
    </a> -->

    <a routerLink="/dashboard" routerLinkActive="bg-gray-100! text-black!"
        class="px-2.5 py-2.5 text-sm flex items-center gap-x-3 rounded-lg text-gray-800 hover:bg-gray-100 hover:text-black">
        <svg lucideLayout class="size-4" />
        Ir al dashboard
    </a>

    <div class="mt-3 py-2 border-t border-gray-200 w-full">
        <button (click)="onLogout()"
            class="w-full px-2.5 py-2.5 text-sm flex items-center gap-x-3 rounded-lg text-gray-800 hover:bg-gray-100 hover:text-black">
            <svg lucideLogOut class="size-4" />
            Cerrar sesión
        </button>
    </div>

</div>
