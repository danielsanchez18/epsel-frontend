<div class="hs-overlay-animation-target hs-overlay-open:scale-100 hs-overlay-open:opacity-100 scale-95 opacity-0 ease-in-out transition-all duration-200 sm:max-w-lg sm:w-full m-3 sm:mx-auto min-h-[calc(100%-56px)] flex items-center">
  <form [formGroup]="addForm" (ngSubmit)="onSubmit()" class="w-full flex flex-col bg-white border border-gray-300 shadow-2xs rounded-xl pointer-events-auto">

    <!-- Header del modal -->
    <div class="flex justify-between items-center py-3 px-4 border-b border-gray-200">
      <h3 id="hs-scale-animation-modal-label" class="font-medium">Registar nuevo cliente</h3>
      <button type="button" #closeButton
        class="size-8 inline-flex justify-center items-center gap-x-2 rounded-full bg-gray-100 text-gray-800 hover:bg-gray-200 focus:outline-hidden focus:bg-gray-300 disabled:opacity-50 disabled:pointer-events-none"
        aria-label="Close" data-hs-overlay="#hs-scale-animation-modal">
        <span class="sr-only">Close</span>
        <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18"></path>
          <path d="m6 6 12 12"></path>
        </svg>
      </button>
    </div>

    <!-- Contenido del modal -->
    <div class="px-4 py-4 overflow-y-auto grid sm:grid-cols-2 gap-5">

      <div class="flex flex-col gap-y-2 sm:col-span-2">
        <label name="names" class="text-sm font-medium">
          Tipo de Cliente
          <span class="text-red-500 ml-0.5">*</span>
        </label>
        <select name="customerType" formControlName="customerType" required
          class="border border-gray-200 rounded-md px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
          <option value="" disabled selected>Seleccione un tipo de cliente</option>
          <option value="PERSON">Individual</option>
          <option value="COMPANY">Corporativo</option>
        </select>
      </div>

      <div class="flex flex-col gap-y-2 sm:col-span-2">
        <label name="names" class="text-sm font-medium">
          Número de Documento
          <span class="text-red-500 ml-0.5">*</span>
        </label>
        <input type="text"
          name="documentNumber"
          formControlName="documentNumber"
          (keypress)="allowOnlyNumbers($event)"
          [attr.maxlength]="customerTypeSelected === 'PERSON' ? 8 : (customerTypeSelected === 'COMPANY' ? 11 : 0)"
          class="border border-gray-200 rounded-md px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          placeholder="Ej: 123456789" required />
        <span *ngIf="addForm.get('documentNumber')?.invalid && addForm.get('documentNumber')?.touched" class="text-xs text-red-500">
          * Debe tener {{ customerTypeSelected === 'PERSON' ? '8' : '11' }} dígitos numéricos.
        </span>
      </div>

      <div class="flex flex-col gap-y-2 sm:col-span-2">
        <label name="names" class="text-sm font-medium">
          Nombres Completos
          <span class="text-red-500 ml-0.5">*</span>
        </label>
        <input type="text"
          name="fullName"
          formControlName="fullName"
          class="border border-gray-200 rounded-md px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          placeholder="Ej: José David Pérez del Valle" required />
      </div>

      <div class="flex flex-col gap-y-2">
        <label name="names" class="text-sm font-medium">
          Correo Electrónico
          <span class="text-red-500 ml-0.5">*</span>
        </label>
        <input type="email" name="email"
          formControlName="email"
          class="border border-gray-200 rounded-md px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          placeholder="Ej: jose.david@ejemplo.com" required />
        <span *ngIf="addForm.get('email')?.invalid && addForm.get('email')?.touched" class="text-xs text-red-500">
          * Ingrese un correo electrónico válido.
        </span>
      </div>

      <div class="flex flex-col gap-y-2">
        <label name="names" class="text-sm font-medium">
          Teléfono
          <span class="text-red-500 ml-0.5">*</span>
        </label>
        <input type="text" name="phone"
          formControlName="phone"
          (keypress)="allowOnlyNumbers($event)"
          maxlength="9"
          class="border border-gray-200 rounded-md px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          placeholder="Ej: 936245721" required />
        <span *ngIf="addForm.get('phone')?.invalid && addForm.get('phone')?.touched" class="text-xs text-red-500">
          * El teléfono debe contener exactamente 9 dígitos.
        </span>
      </div>

    </div>

    <!-- Footer del modal -->
    <div class="flex justify-end items-center gap-x-2 py-3 px-4">
      <button type="reset"
        class="py-2 px-3 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg bg-white border border-gray-200 hover:bg-gray-100 disabled:opacity-50 disabled:pointer-events-none"
        data-hs-overlay="#hs-scale-animation-modal">
        Cancelar
      </button>
      <button type="submit" [disabled]="addForm.invalid || isLoading"
        class="py-2 px-3 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg bg-blue-600 border border-blue-600 text-white hover:bg-blue-700 focus:outline-hidden focus:bg-blue-700 disabled:opacity-50 disabled:pointer-events-none">
        <span *ngIf="isLoading" class="animate-spin inline-block size-4 border-2 border-current border-t-transparent text-white rounded-full" role="status" aria-label="loading"></span>
        {{ isLoading ? 'Guardando...' : 'Guardar' }}
      </button>
    </div>
  </form>
</div>
