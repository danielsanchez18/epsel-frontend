<article class="bg-white rounded-xl border border-gray-200 p-5 flex flex-col gap-4 w-full">
  <div class="flex items-center gap-x-2 border-b border-gray-100 pb-3">
    <div class="p-1.5 bg-blue-50 text-blue-600 rounded-lg">
      <svg lucideUser class="size-5"></svg>
    </div>
    <h2 class="font-semibold text-sm text-gray-900">Información del Cliente</h2>
  </div>

  <div class="grid grid-cols-1 gap-y-3 text-sm">
    <div class="flex flex-col gap-0.5">
      <span class="text-xs text-gray-500 font-medium">Nombre Completo / Razón Social</span>
      <span class="font-medium text-gray-900">{{ customerName }}</span>
    </div>
    <div class="flex flex-col gap-0.5">
      <span class="text-xs text-gray-500 font-medium">Documento de Identidad (DNI/RUC)</span>
      <span class="font-medium text-gray-900">{{ getCustomerDocument() }}</span>
    </div>
    <div class="flex flex-col gap-0.5">
      <span class="text-xs text-gray-500 font-medium">Teléfono de Contacto</span>
      <span class="font-medium text-gray-900 text-nowrap">{{ supply?.customerPhone || 'No registrado' }}</span>
    </div>
  </div>
</article>
